name: 桌面客户端构建

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows 11 (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r client/requirements.txt
      - name: PyInstaller 打包
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name ssh-web-client `
            --add-data "client/assets;assets" `
            --collect-all webview `
            client/main.py
      - name: 压缩产物
        shell: pwsh
        run: Compress-Archive -Path dist/ssh-web-client/* -DestinationPath ssh-web-client-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-web-client-windows-x64
          path: ssh-web-client-windows-x64.zip
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ssh-web-client-windows-x64.zip

  build-macos-arm64:
    name: macOS (Apple Silicon / M 系列)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r client/requirements.txt
      - name: PyInstaller 打包（.app）
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name ssh-web-client \
            --osx-bundle-identifier com.sshweb.client \
            --add-data "client/assets:assets" \
            --collect-all webview \
            client/main.py
      - name: 压缩产物
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/ssh-web-client.app ssh-web-client-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-web-client-macos-arm64
          path: ssh-web-client-macos-arm64.zip
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ssh-web-client-macos-arm64.zip
